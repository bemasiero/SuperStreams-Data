name: Generate Global Schedule

on:
  schedule:
    - cron: '0 */4 * * *' # Run every 4 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: node scraper.js

      # Claro's lineup/EPG data is a separate, unofficial API from ESPN's —
      # a hiccup there must never block publishing the sports schedule this
      # job exists for, since force_orphan below wipes and republishes
      # everything from this one checkout in a single deploy.
      - name: Run Claro Scraper
        continue-on-error: true
        run: node claro-scraper.js

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,scraper.js,claro-scraper.js,package.json,package-lock.json,node_modules'
